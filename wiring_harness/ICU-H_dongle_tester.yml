      #   mpn: 2109006-1 MALE MATE
      # - type: Crimp
      #   subtype: 060 Terminal, 1.25mm^2 wire
      #   qty: 4
      #   manufacturer: TE Connectivity
      #   mpn: 2109006-3 MALE MATE

  ICU_H_MALE_MATE:
    type: 32-pin
    subtype: male
    pinlabels: [NC, NC, NC, NC, NC, NC, HR, NC, NC, NC, NC, NC, NC, NC, NC, GND, E-CAN (HIGH), E-CAN (LOW), P-CAN (HIGH), P-CAN (LOW), C-CAN (HIGH), C-CAN (LOW), I-CAN (HIGH), I-CAN (LOW), D-CAN (HIGH), D-CAN (LOW), B-CAN (HIGH), B-CAN (LOW), G-CAN (HIGH), G-CAN (LOW), M-CAN (HIGH), M-CAN (LOW)]
    mpn: Wire-to-wire male mate to KSC 5011-0137-2
    additional_components:
      - type: Crimp
        qty: 18
      # - type: Crimp
      #   subtype: 020 Terminal
      #   qty: 11
      #   manufacturer: TE Connectivity
      #   mpn: 2219299-1 MALE MATE
      # - type: Crimp
      #   subtype: 060 Terminal, 0.3mm^2 wire


  50_pin_m:
    type: 50-pin
    pincount: 18
    subtype: male

  50_pin_f_breakout:
    type: 50-pin
    pincount: 18
    subtype: female

  DuPont_1pin:
    type: 1-pin
    pincount: 1
    subtype: male

  Splice:
    type: splice
    pinlabels: [5V_PWR]

cables:
  W1:
    type: insulated conductive wire (any)
    gauge: 0.2 mm2
    length: 0.05
    # colors: [BGRD, BNRD, WHRD, BGBK, BNBK, WHBK, OG, GNOG, YEOG, PK, RD, BKBG, BK]
    wirecount: 18
    shield: false

  W2:
    type: insulated conductive wire (any)
    gauge: 0.2 mm2
    length: 0.05
    # colors: [BGRD, BNRD, WHRD, BGBK, BNBK, WHBK, OG, GNOG, YEOG, PK, RD, BKBG, BK]
    wirecount: 1
    shield: false

connections:
  - 
    - ICU_H_5011_0137_2: [7,16,17-32]
    - W1.: [1-18]
    - 50_pin_m.: [1-18]
    - ==>
    - 50_pin_f_breakout.: [1-18]
    - W2.
    - DuPont_1pin.
  -
    - ICU_H_MALE_MATE: [7,16,17-32]
    - W1.: [1-18]
    - 50_pin_m.: [1-18]
    - ==>
    - 50_pin_f_breakout.: [1-18]
